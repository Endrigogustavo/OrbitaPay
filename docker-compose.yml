x-servico: &servico
  restart: unless-stopped
  environment: &ambiente
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USERNAME: orbita
    RABBITMQ_PASSWORD: orbita
    AUTH_URL: http://auth:9001
    CLIENTES_URL: http://clientes:9002
    ATIVOS_URL: http://ativos:9003
    NEGOCIACAO_URL: http://negociacao:9004
    PAGAMENTOS_URL: http://pagamentos:9005
  healthcheck: &saude
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 20s

x-mongo: &mongo
  image: mongo:8
  restart: unless-stopped
  command: ["--replSet", "rs0", "--bind_ip_all"]
  healthcheck:
    test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } if (!db.hello().isWritablePrimary) { quit(1) }"
    interval: 5s
    timeout: 3s
    retries: 20

networks:
  orbita:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: orbita
      RABBITMQ_DEFAULT_PASS: orbita
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      orbita: { ipv4_address: 172.30.0.10 }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-auth:
    <<: *mongo
    volumes: [mongo-auth:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.191 }
  mongo-clientes:
    <<: *mongo
    volumes: [mongo-clientes:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.192 }
  mongo-ativos:
    <<: *mongo
    volumes: [mongo-ativos:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.193 }
  mongo-negociacao:
    <<: *mongo
    volumes: [mongo-negociacao:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.194 }
  mongo-pagamentos:
    <<: *mongo
    volumes: [mongo-pagamentos:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.195 }

  mongo-local:
    <<: *mongo
    profiles: ["local"]
    ports:
      - "27018:27017"
    volumes: [mongo-local:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.199 }

  auth:
    <<: *servico
    build: ./backend/auth
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-auth:27017/orbita_auth?directConnection=true
    expose: ["9001"]
    networks:
      orbita: { ipv4_address: 172.30.0.91 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9001"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-auth: { condition: service_healthy }

  clientes:
    <<: *servico
    build: ./backend/clientes
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-clientes:27017/orbita_clientes?directConnection=true
    expose: ["9002"]
    networks:
      orbita: { ipv4_address: 172.30.0.92 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9002"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-clientes: { condition: service_healthy }

  ativos:
    <<: *servico
    build: ./backend/ativos
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-ativos:27017/orbita_ativos?directConnection=true
    expose: ["9003"]
    networks:
      orbita: { ipv4_address: 172.30.0.93 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9003"]
    depends_on:
      mongo-ativos: { condition: service_healthy }

  negociacao:
    <<: *servico
    build: ./backend/negociacao
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-negociacao:27017/orbita_negociacao?directConnection=true
    expose: ["9004"]
    networks:
      orbita: { ipv4_address: 172.30.0.94 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9004"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-negociacao: { condition: service_healthy }

  pagamentos:
    <<: *servico
    build: ./backend/pagamentos
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-pagamentos:27017/orbita_pagamentos?directConnection=true
    expose: ["9005"]
    networks:
      orbita: { ipv4_address: 172.30.0.95 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9005"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-pagamentos: { condition: service_healthy }

  gateway:
    <<: *servico
    build: ./backend/gateway
    ports:
      - "9000:9000"
    networks:
      orbita: { ipv4_address: 172.30.0.90 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9000"]
    depends_on:
      auth: { condition: service_healthy }
      clientes: { condition: service_healthy }
      ativos: { condition: service_healthy }
      negociacao: { condition: service_healthy }
      pagamentos: { condition: service_healthy }

  k6:
    image: grafana/k6:latest
    profiles: ["testes"]
    environment:
      BASE_URL: http://gateway:9000
    volumes:
      - ./k6:/scripts
    working_dir: /scripts
    networks: [orbita]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  mongo-auth:
  mongo-clientes:
  mongo-ativos:
  mongo-negociacao:
  mongo-pagamentos:
  mongo-local:
