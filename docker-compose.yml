x-servico: &servico
  restart: unless-stopped
  environment: &ambiente
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USERNAME: orbita
    RABBITMQ_PASSWORD: orbita
    ORBITA_TOKEN_SEGREDO: ${ORBITA_TOKEN_SEGREDO:-orbita-segredo-de-desenvolvimento-troque-em-producao}
  healthcheck: &saude
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 20s

x-mongo: &mongo
  image: mongo:8
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
    interval: 5s
    timeout: 3s
    retries: 20

networks:
  orbita:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: orbita
      RABBITMQ_DEFAULT_PASS: orbita
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      orbita: { ipv4_address: 172.30.0.10 }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbit-ui:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./rabbit-ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./rabbit-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks:
      orbita: { ipv4_address: 172.30.0.90 }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      rabbitmq: { condition: service_healthy }

  mongo-auth:
    <<: *mongo
    volumes: [mongo-auth:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.186 }
  mongo-clientes:
    <<: *mongo
    volumes: [mongo-clientes:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.181 }
  mongo-contas:
    <<: *mongo
    volumes: [mongo-contas:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.182 }
  mongo-ativos:
    <<: *mongo
    volumes: [mongo-ativos:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.183 }
  mongo-negociacao:
    <<: *mongo
    volumes: [mongo-negociacao:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.184 }
  mongo-carteira:
    <<: *mongo
    volumes: [mongo-carteira:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.185 }
  mongo-pagamentos:
    <<: *mongo
    volumes: [mongo-pagamentos:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.187 }
  mongo-relatorios:
    <<: *mongo
    volumes: [mongo-relatorios:/data/db]
    networks:
      orbita: { ipv4_address: 172.30.0.188 }

  auth:
    <<: *servico
    build: ./backend/auth
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-auth:27017/orbita_auth
    expose: ["8086"]
    networks:
      orbita: { ipv4_address: 172.30.0.86 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8086"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-auth: { condition: service_healthy }

  contas:
    <<: *servico
    build: ./backend/contas
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-contas:27017/orbita_contas
    expose: ["8082"]
    networks:
      orbita: { ipv4_address: 172.30.0.82 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8082"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-contas: { condition: service_healthy }

  negociacao:
    <<: *servico
    build: ./backend/negociacao
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-negociacao:27017/orbita_negociacao
    expose: ["8084"]
    networks:
      orbita: { ipv4_address: 172.30.0.84 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8084"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-negociacao: { condition: service_healthy }

  carteira:
    <<: *servico
    build: ./backend/carteira
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-carteira:27017/orbita_carteira
    expose: ["8085"]
    networks:
      orbita: { ipv4_address: 172.30.0.85 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8085"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-carteira: { condition: service_healthy }

  relatorios:
    <<: *servico
    build: ./backend/relatorios
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-relatorios:27017/orbita_relatorios
    expose: ["8088"]
    networks:
      orbita: { ipv4_address: 172.30.0.88 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8088"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-relatorios: { condition: service_healthy }

  pagamentos:
    <<: *servico
    build: ./backend/pagamentos
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-pagamentos:27017/orbita_pagamentos
    expose: ["8087"]
    networks:
      orbita: { ipv4_address: 172.30.0.87 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8087"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-pagamentos: { condition: service_healthy }
      contas: { condition: service_healthy }
      relatorios: { condition: service_healthy }

  ativos:
    <<: *servico
    build: ./backend/ativos
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-ativos:27017/orbita_ativos
    expose: ["8083"]
    networks:
      orbita: { ipv4_address: 172.30.0.83 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8083"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-ativos: { condition: service_healthy }
      negociacao: { condition: service_healthy }
      carteira: { condition: service_healthy }

  clientes:
    <<: *servico
    build: ./backend/clientes
    environment:
      <<: *ambiente
      MONGODB_URI: mongodb://mongo-clientes:27017/orbita_clientes
    expose: ["8081"]
    networks:
      orbita: { ipv4_address: 172.30.0.81 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-clientes: { condition: service_healthy }
      auth: { condition: service_healthy }
      contas: { condition: service_healthy }
      negociacao: { condition: service_healthy }
      carteira: { condition: service_healthy }
      relatorios: { condition: service_healthy }

  gateway:
    <<: *servico
    build: ./backend/gateway
    environment:
      ORBITA_TOKEN_SEGREDO: ${ORBITA_TOKEN_SEGREDO:-orbita-segredo-de-desenvolvimento-troque-em-producao}
      AUTH_URL: http://auth:8086
      CLIENTES_URL: http://clientes:8081
      CONTAS_URL: http://contas:8082
      ATIVOS_URL: http://ativos:8083
      NEGOCIACAO_URL: http://negociacao:8084
      CARTEIRA_URL: http://carteira:8085
      PAGAMENTOS_URL: http://pagamentos:8087
      RELATORIOS_URL: http://relatorios:8088
    ports:
      - "8080:8080"
    networks:
      orbita: { ipv4_address: 172.30.0.80 }
    healthcheck:
      <<: *saude
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    depends_on:
      auth: { condition: service_healthy }
      clientes: { condition: service_healthy }
      contas: { condition: service_healthy }
      ativos: { condition: service_healthy }
      negociacao: { condition: service_healthy }
      carteira: { condition: service_healthy }
      pagamentos: { condition: service_healthy }
      relatorios: { condition: service_healthy }

  k6:
    image: grafana/k6:latest
    profiles: ["testes"]
    environment:
      BASE_URL: http://gateway:8080
    volumes:
      - ./k6:/scripts
    working_dir: /scripts
    networks: [orbita]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  mongo-auth:
  mongo-clientes:
  mongo-contas:
  mongo-ativos:
  mongo-negociacao:
  mongo-carteira:
  mongo-pagamentos:
  mongo-relatorios:
