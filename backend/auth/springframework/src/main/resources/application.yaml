server:
  port: 8086

spring:
  application:
    name: auth-micro
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/orbita_auth}
  data:
    mongodb:
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:orbita}
    password: ${RABBITMQ_PASSWORD:orbita}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

mensageria:
  exchange: orbita.eventos
  exchange-morta: orbita.eventos.mortos
  fila-morta: auth.dlq
  chave-morta: "auth.#"
  fila-de-registros: auth.registros-de-credencial
  topicos:
    bloqueada-por-pin: credencial.bloqueada-por-pin
  assinaturas:
    cliente-eventos:
      fila: auth.cliente-eventos
      topico: "cliente.#"

orbita:
  gerente:
    codigo: ${ORBITA_GERENTE_CODIGO:0000}
  seguranca:
    segredo: ${ORBITA_TOKEN_SEGREDO:orbita-segredo-de-desenvolvimento-troque-em-producao}
    sessao-minutos: 240
    assinatura-segundos: 120
